
name: Build Videlon APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.8"
          cache: true

      - name: Show Flutter environment
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Videlon app icons and splash screen
        run: dart run flutter_native_splash:create

      - name: Build APK
        run: |
          set -o pipefail
          flutter build apk --debug --verbose 2>&1 | tee build-log.txt

      - name: Show build errors
        if: failure()
        run: |
          echo "===== POSSIBLE ERRORS ====="
          grep -in -C 5 -E "error:|exception|failed|FAILURE:|What went wrong" build-log.txt | tail -n 150 || true
          echo "===== END OF ERROR EXTRACT ====="

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Videlon-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
